name: Build signed Android AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish the APK publicly (for example v1.0.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - run: npm ci

      - run: npm test

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bwetv-release.jks"

      - name: Build signed release AAB and APK
        env:
          BWETV_KEYSTORE_FILE: ${{ runner.temp }}/bwetv-release.jks
          BWETV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BWETV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BWETV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run mobile:sync
          cd android
          ./gradlew bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: bwetv-android-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: bwetv-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bwetv-android-apk
          path: release-assets

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cp release-assets/app-release.apk release-assets/bwetv-android.apk
          gh release create "$RELEASE_TAG" \
            release-assets/bwetv-android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "BWE TV Android $RELEASE_TAG" \
            --notes "Signed Android APK for BWE TV, including improved off-air stream handling, playback coordination that pauses other media, and 30-minute inactivity sign-out for signed-in members. Download bwetv-android.apk and install it on an Android device. If upgrading from a debug/test build, uninstall that build first."

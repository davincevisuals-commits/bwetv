  <main id="main-content">
    <section class="bg-gradient-to-r from-red-600 to-red-800 px-6 py-10 text-center text-white">
      <div class="site-shell">
        <h1 class="mb-3 text-4xl font-bold">BWE TV Live Chat</h1>
        <p class="mx-auto max-w-3xl text-lg opacity-90">Chat with viewers in real time. Looking for discussion posts and support? Visit the <a href="community.html" class="underline">Community page</a>.</p>

    <section class="bg-gray-50 px-6 py-8">

        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-2xl font-bold text-gray-900">Live Chat</h2>
          <span id="chatStatus" class="rounded bg-gray-800 px-2 py-1 text-xs" role="status" aria-live="polite">Connecting...</span>
        </div>
        <div id="liveChat" class="h-96 overflow-y-auto rounded border border-gray-200 bg-gray-50 p-3" aria-live="polite" aria-label="Live chat messages"></div>
        <form id="chatForm" class="mt-4 flex gap-2">
          <input id="chatInput" type="text" maxlength="260" autocomplete="off" class="flex-1 rounded border border-gray-300 p-3 text-gray-800" placeholder="Type a message..." aria-label="Chat message">
          <button id="chatBtn" type="submit" class="rounded bg-red-600 px-5 py-3 font-semibold text-white transition hover:bg-red-700 disabled:opacity-50" disabled>Send</button>
        </form>
      </div>

      if (window.__bwetvFirebaseReady) return;
      if (!window.firebase || !window.firebase.initializeApp) return;
      if (!window.firebase.apps || !window.firebase.apps.length) {

  <script src="shared-live-chat.js" defer></script>
  <script src="content.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.initializeFirebase) window.initializeFirebase();
      if (window.BWELiveChat) {
        BWELiveChat.init({ chatPath: 'channels/live-chat/messages', maxLength: 260 });
      }

      var mobileMenuBtn = document.getElementById('mobileMenuBtn');
      var mobileMenu = document.getElementById('mobileMenu');
      if (mobileMenuBtn && mobileMenu) {
        mobileMenuBtn.addEventListener('click', function () {
          var expanded = this.getAttribute('aria-expanded') === 'true';
          this.setAttribute('aria-expanded', String(!expanded));
          mobileMenu.classList.toggle('hidden');
        });
      }

      document.querySelectorAll('[data-nav-link]').forEach(function (link) {
        if (link.getAttribute('href') === location.pathname.split('/').pop()) {
          link.classList.add('nav-link-active');
        }
      });
    });
  </script>

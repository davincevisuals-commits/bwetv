<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BWE TV Content Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    body { background: #f3f4f6; }
    button {
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    button:focus-visible {
      outline: 3px solid rgba(220, 38, 38, 0.25);
      outline-offset: 2px;
    }
    .card { background: white; border-radius: 1rem; box-shadow: 0 10px 28px rgba(17, 24, 39, 0.08); }
    .field { width: 100%; border: 1px solid #d1d5db; border-radius: 0.75rem; padding: 0.65rem 0.8rem; }
    .field:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15); }
    .tab-btn.active { background: #dc2626; color: white; }
    .tab-btn { border: 1px solid #d1d5db; background: white; border-radius: 0.75rem; padding: 0.7rem 1rem; font-weight: 700; transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease; }
    .tab-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <header class="bg-red-700 text-white shadow-lg">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
      <div>
        <a href="index.html" class="text-xl font-bold">BWE TV</a>
        <span class="ml-2 rounded-full bg-white/15 px-2 py-1 text-[10px] font-bold uppercase tracking-[0.2em]">Admin</span>
      </div>
      <nav class="flex items-center gap-3 text-sm font-semibold">
        <a href="shows.html" class="hover:text-red-100">Shows</a>
        <a href="index.html" class="hover:text-red-100">Website</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-5 py-8">
    <section id="loginPanel" class="mx-auto max-w-md card p-6">
      <h1 class="text-2xl font-bold text-gray-900">Sign in to manage content</h1>
      <p class="mt-2 text-sm text-gray-600">Use your Firebase admin account to update shows, episodes, and site settings.</p>

      <form id="loginForm" class="mt-6 space-y-4">
        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700" for="emailInput">Email</label>
          <input id="emailInput" class="field" type="email" placeholder="admin@example.com" required />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700" for="passwordInput">Password</label>
          <input id="passwordInput" class="field" type="password" placeholder="Enter password" required />
        </div>

        <button type="submit" class="w-full rounded-xl bg-red-600 px-4 py-3 text-sm font-bold text-white transition hover:bg-red-700">Sign In</button>
      </form>
